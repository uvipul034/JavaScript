<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body  style = "background-color: #212121; color: #fff;">
 <nav>
        <a href ="/" aria-current = "page">Home</a>
        <a target = "_blank" href = "https://ideological-arena.vercel.app">Ideological Arena</a>
    </nav>
    <div id = "wrapper">
        <h1>Number Guessing Game</h1>
        <p>Try and guess a random number between 1 & 100</p>
        <p>You have 10 attempt to guess the right number</p>
        <form  class="form">
            <label for="guessField" id ="guess">Guess a number</label>
            <input type="text" class="guessField" id ="guessField">
            <input type="submit" id ="subt" value="Submit Guess" class ="guessSubmit">
        </form>
        <div class="resultTamtam">
            <p>Previous Guesses <span class = "guesses"></span></p>
            <p>Guesses Remaining<span class = "lastResult">10</span></p>
            <p class = "lowOrHi"></p>
        </div>
    </div>
    <script src = "tavascript.js"></script>
</body>
</html>
